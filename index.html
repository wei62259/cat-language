<style>
:root{
  --bg:#4D80FF;
  --ink:#111111;
  --paper:#FFFDF2;
  --accent:#FF4D2E;
  --accent-2:#FFE14D;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Huninn","Yusei Magic","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  overflow:hidden;
  position:relative;
  -webkit-tap-highlight-color:transparent;
}

/* ── 背景塗鴉裝飾 ── */
.doodle{position:absolute;pointer-events:none;opacity:.4;z-index:0;}
.doodle svg{display:block;}
.dd-star{top:6%;left:6%;width:42px;}
.dd-bang{top:9%;right:8%;width:26px;transform:rotate(12deg);}
.dd-paw{bottom:10%;right:6%;width:48px;transform:rotate(-14deg);}
.dd-wave{bottom:16%;left:5%;width:70px;transform:rotate(-6deg);}
.dd-star2{top:42%;right:3%;width:26px;transform:rotate(-20deg);}
@media (max-width:480px){.dd-wave,.dd-star2{display:none;}}

/* ── 版面 ── */
header{padding:max(14px,env(safe-area-inset-top)) 16px 0;text-align:center;z-index:2;}
h1{
  display:flex;justify-content:center;align-items:center;
  gap:clamp(6px,1.9vw,13px);
  font-size:clamp(1.5rem,5.6vw,2.4rem);
  line-height:1;color:var(--ink);
}
h1 .tile{
  display:grid;place-items:center;
  width:clamp(43px,10.4vw,74px);aspect-ratio:1;
  background:var(--paper);
  border:4px solid var(--ink);
  border-radius:26% 22% 25% 23%;
}
h1 .tile:nth-child(odd){transform:rotate(-4deg);}
h1 .tile:nth-child(even){transform:rotate(3deg);background:var(--accent-2);border-radius:22% 26% 23% 25%;}
h1 .tile:nth-child(4){transform:rotate(4.5deg);}
.subtitle{
  display:inline-block;margin-top:10px;
  font-size:clamp(.95rem,3.5vw,1.15rem);
  background:var(--ink);color:var(--paper);
  padding:7px 22px;
  border-radius:48% 52% 50% 50% / 55% 48% 52% 45%;
  transform:rotate(1deg);
}
main{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  width:100%;max-width:560px;padding:0 16px 20px;z-index:2;position:relative;
}

/* ── 對話泡泡 ── */
.bubble-zone{
  min-height:clamp(96px,17dvh,150px);
  width:100%;display:flex;align-items:flex-end;justify-content:center;
  margin-bottom:4px;
}
.bubble{
  position:relative;
  background:var(--paper);color:var(--ink);
  border:4px solid var(--ink);
  border-radius:42% 58% 55% 45% / 48% 44% 56% 52%;
  padding:24px 36px 28px;
  max-width:100%;
  text-align:center;
  transform:scale(0);
  visibility:hidden;
}
.bubble.show{
  visibility:visible;
  animation:pop .45s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes pop{0%{transform:scale(0) rotate(-4deg);}70%{transform:scale(1.1) rotate(1deg);}100%{transform:scale(1) rotate(0);}}
.bubble::after{
  content:"";position:absolute;left:50%;bottom:-14px;
  width:22px;height:22px;background:var(--paper);
  border-right:4px solid var(--ink);border-bottom:4px solid var(--ink);
  transform:translateX(-40%) rotate(40deg) skew(8deg);
}
.bubble-text{
  font-size:clamp(1.05rem,4.2vw,1.3rem);
  line-height:1.45;font-weight:700;min-height:1.4em;
  position:relative;
}
#btSizer{visibility:hidden;display:block;}
#btType{position:absolute;left:0;right:0;top:0;}
.tag{
  display:inline-block;margin-top:10px;
  background:var(--accent-2);color:var(--ink);
  border:3px solid var(--ink);
  padding:5px 18px;font-size:clamp(.8rem,3vw,.95rem);font-weight:700;
  border-radius:45% 55% 50% 50% / 52% 48% 55% 45%;
  transform:rotate(-3deg);
}
.tag:empty{display:none;}

/* ── 貓咪 ── */
.cat-wrap{position:relative;width:min(78vw,360px);}
.cat-svg{
  width:100%;height:auto;display:block;max-height:38dvh;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1);
}
.state-thinking .cat-svg{transform:rotate(-8deg);}
.cat-svg .ear,.cat-svg .eye,.cat-svg .pupil{transform-box:fill-box;transform-origin:center;}
.cat-svg .ear{transform-origin:50% 90%;transition:transform .3s ease;}
.cat-svg .eye{transition:transform .15s ease;}
.cat-svg .pupil{transition:transform .25s ease;}
.cat-svg .lid{transform-box:fill-box;transform-origin:center;transition:transform .3s ease;}

/* 狀態表情 */
.state-recording .ear-l{animation:wigL 1.1s ease-in-out infinite;}
.state-recording .ear-r{animation:wigR 1.1s ease-in-out infinite .15s;}
@keyframes wigL{0%,100%{transform:rotate(-7deg);}50%{transform:rotate(5deg);}}
@keyframes wigR{0%,100%{transform:rotate(7deg);}50%{transform:rotate(-5deg);}}
.state-recording .pupil{transform:scale(1.3);}
.state-recording .lid{transform:translateY(-9px);}
.state-thinking .eye{transform:scaleY(.32);}
.state-result .lid{transform:translateY(-9px);}
.state-error .lid{transform:translateY(6px);}
.state-error .ear-l{transform:rotate(16deg);}
.state-error .ear-r{transform:rotate(-16deg);}
/* 拆穿人類：嫌棄臉（眼皮半垂＋耳朵後壓），覆蓋 result 的睜眼 */
.busted .lid{transform:translateY(6px);}
.busted .ear-l{transform:rotate(14deg);}
.busted .ear-r{transform:rotate(-14deg);}
.eye.blink{transform:scaleY(.06)!important;}
.ear.twitch{animation:twitch .3s ease;}
@keyframes twitch{0%,100%{transform:rotate(0);}50%{transform:rotate(-10deg);}}

/* 思考小泡泡 */
.think-bubble{
  position:absolute;top:-8px;right:-6px;
  background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);
  border-radius:55% 45% 50% 50% / 48% 56% 44% 52%;
  padding:6px 14px;font-size:1.1rem;font-weight:700;
  display:none;transform:rotate(6deg);
  animation:bob 1s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:rotate(6deg) translateY(0);}50%{transform:rotate(6deg) translateY(-6px);}}
.state-thinking .think-bubble{display:block;}

/* ── 錄音按鈕 ── */
.controls{
  display:flex;flex-direction:column;align-items:center;
  padding:3px 0 6px;width:100%;
}
.btn-wrap{position:relative;display:grid;place-items:center;}
.vol-ring{
  position:absolute;inset:-8px;
  background:var(--accent-2);
  border-radius:46% 54% 50% 50% / 52% 48% 54% 46%;
  opacity:0;transform:scale(.9);pointer-events:none;
  transition:transform .08s linear;
}
.state-recording .vol-ring{opacity:1;}
#recBtn{
  font-family:inherit;font-weight:700;
  font-size:clamp(1.15rem,4.5vw,1.4rem);
  letter-spacing:.12em;
  background:var(--ink);color:var(--paper);
  border:4px solid var(--ink);
  border-radius:44% 56% 52% 48% / 54% 46% 58% 42%;
  padding:16px 44px;cursor:pointer;
  transition:transform .12s ease,background .2s ease;
  z-index:1;
}
#recBtn:hover{transform:scale(1.05) rotate(-1.5deg);}
#recBtn:active{transform:scale(.95);}
#recBtn:focus-visible{outline:5px dashed var(--ink);outline-offset:5px;}
#recBtn:focus:not(:focus-visible){outline:none;} /* 滑鼠點擊不顯示焦點框 */
#recBtn:disabled{opacity:.55;cursor:not-allowed;transform:none;}
.state-recording #recBtn{background:var(--accent);color:var(--paper);border-color:var(--accent);}
.helper{
  margin-top:12px;min-height:1.5em;
  font-size:clamp(.85rem,3.3vw,1rem);
  text-align:center;font-weight:700;letter-spacing:.05em;
}
footer{
  width:100%;
  background:var(--accent-2);color:var(--ink);
  padding:10px 0 max(12px,env(safe-area-inset-bottom));
  font-size:clamp(.72rem,2.8vw,.85rem);
  z-index:2;line-height:1.5;font-weight:700;
  overflow:hidden;
}
.m-track{display:inline-flex;white-space:nowrap;animation:marquee 75s linear infinite;will-change:transform;}
.m-half{display:inline-block;}
.m-paw{width:1em;height:1em;vertical-align:-.12em;margin:0 1.6em;fill:var(--ink);}
@keyframes marquee{to{transform:translateX(-50%);}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
  .bubble.show{transform:scale(1);}
}
</style>
</head>

var SILENT_PHRASE = {t:"……（貓咪選擇已讀不回）", g:"已讀不回率 100%"};
var BUST_PHRASES = [ /* 偵測到人聲：拆穿 */
  {t:"偵測到大型無毛猿類，請出示貓證。", g:"人類濃度 99%"},
  {t:"這聲音的鬍鬚含量 0%，你當朕聾了嗎？", g:"拆穿成功率 100%"},
  {t:"學貓叫之前，先回去練個三年再來。", g:"評審分數 26 分"},
  {t:"朕聽出來了，是鏟屎官假扮的，罰你開兩個罐罐。", g:"罰款等級 ★★★★"},
  {t:"翻譯結果：一隻人類在說人話。需要朕幫你翻成貓語嗎？", g:"反向翻譯費 9.9 喵幣"},
  {t:"喉嚨裡沒有呼嚕器，裝什麼貓。", g:"偽裝失敗 MAX"},
  {t:"本喵的耳朵是精密儀器，這個聲帶頻率騙不了朕。", g:"儀器信心 98%"},
  {t:"嗯……這是『人話』，朕選擇已讀。", g:"不予理會指數 ★★★★★"}
];

/* ───────── 參數 ───────── */
var MAX_SEC = 10;          // 錄音上限
var SHORT_SEC = 2;         // 短／長分界
var LOUD_RMS = 0.05;       // 大聲門檻（可校準）
var SILENT_RMS = 0.008;    // 無聲門檻
var THINK_MS = 1700;       // 思考動畫時長
/* 人聲偵測（保守門檻，避免誤判低音貓） */
var HUMAN_PITCH = 235;     // 中位音高低於此視為人聲候選（Hz）
var HUMAN_LOW_FRAC = 0.7;  // 低音高 frame 佔比門檻
var MIN_PITCH_FRAMES = 6;  // 至少要有這麼多有效音高樣本才判斷

/* ───────── DOM ───────── */
var body = document.body;
var recBtn = document.getElementById("recBtn");
var helper = document.getElementById("helper");
var bubble = document.getElementById("bubble");
var btSizer = document.getElementById("btSizer");
var btType = document.getElementById("btType");
var tagEl = document.getElementById("tag");
var volRing = document.getElementById("volRing");
var thinkBubble = document.getElementById("thinkBubble");
var pupils = [
  {el:document.querySelector(".pupil-l")},
  {el:document.querySelector(".pupil-r")}
];
var eyes = document.querySelectorAll(".eye");
var ears = document.querySelectorAll(".ear");

var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var isTouch = window.matchMedia("(pointer: coarse)").matches;

var state = "idle";
var lastPhrase = "";
var stream = null, audioCtx = null, analyser = null;
var rafId = 0, recStart = 0, rmsSamples = [], pitchSamples = [], frameCount = 0;

/* 自相關音高偵測：即時取頻率，不保留任何音訊資料 */
function detectPitch(buf, sr){
  var n = buf.length, i;
  var minLag = Math.floor(sr/600);                 // 上限 600Hz
  var maxLag = Math.min(Math.floor(sr/70), n-4);   // 下限 70Hz
  var f = new Float32Array(n), mean = 0;
  for(i=0;i<n;i++){ f[i]=(buf[i]-128)/128; mean+=f[i]; }
  mean/=n;
  var energy=0;
  for(i=0;i<n;i++){ f[i]-=mean; energy+=f[i]*f[i]; }
  if(energy < n*0.0004) return -1;                 // 太小聲不算
  var corrs = new Float32Array(maxLag+1);
  var best=0, lag, sum;
  for(lag=minLag;lag<=maxLag;lag++){
    sum=0;
    for(i=0;i<n-lag;i+=2) sum+=f[i]*f[i+lag];
    corrs[lag] = (2*sum/energy) * (n/(n-lag));
    if(corrs[lag]>best) best=corrs[lag];
  }
  if(best<0.45) return -1;
  /* 防倍頻誤判：取相關度達最大值 90% 的「最小」週期，再爬到該峰的峰頂 */
  for(lag=minLag;lag<=maxLag;lag++){
    if(corrs[lag] >= best*0.9){
      while(lag<maxLag && corrs[lag+1] > corrs[lag]) lag++;
      return sr/lag;
    }
  }
  return -1;
}
var typeTimer = 0, thinkTimer = 0, thinkCycle = 0, driftTimer = 0;

function setState(s){
  body.classList.remove("state-" + state);
  state = s;
  body.classList.add("state-" + state);
}

/* ───────── 眼球追蹤 ───────── */
var lastPointer = 0;
function aimPupils(clientX, clientY){
  pupils.forEach(function(p){
    var eye = p.el.parentNode;
    var r = eye.getBoundingClientRect();
    var cx = r.left + r.width/2, cy = r.top + r.height/2;
    var dx = clientX - cx, dy = clientY - cy;
    var dist = Math.min(1, Math.hypot(dx, dy) / 260);
    var ang = Math.atan2(dy, dx);
    p.el.setAttribute("transform",
      "translate(" + (Math.cos(ang)*16*dist).toFixed(1) + " " + (Math.sin(ang)*10*dist).toFixed(1) + ")");
  });
}
function resetPupils(){
  pupils.forEach(function(p){ p.el.setAttribute("transform","translate(0 0)"); });
}
if(!reduceMotion){
  document.addEventListener("mousemove", function(e){
    lastPointer = Date.now();
    if(state==="idle" || state==="result" || state==="error") aimPupils(e.clientX, e.clientY);
  });
  document.addEventListener("touchmove", function(e){
    lastPointer = Date.now();
    var t = e.touches[0];
    if(t && (state==="idle" || state==="result" || state==="error")) aimPupils(t.clientX, t.clientY);
  }, {passive:true});
  document.addEventListener("touchstart", function(e){
    lastPointer = Date.now();
    var t = e.touches[0];
    if(t && (state==="idle" || state==="result" || state==="error")) aimPupils(t.clientX, t.clientY);
  }, {passive:true});

  /* 沒有指標活動時，視線隨機飄移（主要給手機） */
  (function drift(){
    driftTimer = setTimeout(function(){
      if((state==="idle"||state==="result") && Date.now()-lastPointer > 2800){
        var a = Math.random()*Math.PI*2, d = .4 + Math.random()*.6;
        pupils.forEach(function(p){
          p.el.setAttribute("transform",
            "translate(" + (Math.cos(a)*16*d).toFixed(1) + " " + (Math.sin(a)*10*d).toFixed(1) + ")");
        });
      }
      drift();
    }, 3000 + Math.random()*2000);
  })();

  /* 隨機眨眼 */
  (function blink(){
    setTimeout(function(){
      if(state!=="thinking"){
        eyes.forEach(function(e){ e.classList.add("blink"); });
        setTimeout(function(){ eyes.forEach(function(e){ e.classList.remove("blink"); }); }, 150);
      }
      blink();
    }, 2500 + Math.random()*3500);
  })();

  /* 耳朵偶爾抽動 */
  (function twitch(){
    setTimeout(function(){
      if(state==="idle"||state==="result"){
        var ear = ears[Math.random()<.5?0:1];
        ear.classList.add("twitch");
        setTimeout(function(){ ear.classList.remove("twitch"); }, 320);
      }
      twitch();
    }, 4000 + Math.random()*5000);
  })();
}

/* ───────── 錄音 ───────── */
function supported(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia &&
    (window.AudioContext || window.webkitAudioContext));
}

function startRecording(){
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
    stream = s;
    var AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    var src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    src.connect(analyser);

    rmsSamples = []; pitchSamples = []; frameCount = 0;
    recStart = performance.now();
    setState("recording");
    recBtn.textContent = "停止";
    hideBubble();
    var buf = new Uint8Array(analyser.fftSize);

    (function loop(){
      analyser.getByteTimeDomainData(buf);
      var sum = 0;
      for(var i=0;i<buf.length;i++){ var v=(buf[i]-128)/128; sum += v*v; }
      var rms = Math.sqrt(sum/buf.length);
      rmsSamples.push(rms);

      /* 每 3 個 frame 偵測一次音高，省效能 */
      frameCount++;
      if(frameCount % 3 === 0 && rms > 0.015){
        var p = detectPitch(buf, audioCtx.sampleRate);
        if(p > 0) pitchSamples.push(p);
      }

      volRing.style.transform = "scale(" + (1 + Math.min(rms*4, .4)) + ")";
      var sec = (performance.now() - recStart)/1000;
      helper.textContent = "喵喵聆聽中… " + sec.toFixed(1) + "s / " + MAX_SEC + "s";

      if(sec >= MAX_SEC){ stopRecording(); return; }
      rafId = requestAnimationFrame(loop);
    })();
  }).catch(function(err){
    if(err && (err.name==="NotAllowedError"||err.name==="PermissionDeniedError"||err.name==="SecurityError")){
      showError("沒有麥克風，朕怎麼開口？請允許麥克風權限再試一次。");
    }else if(err && err.name==="NotFoundError"){
      showError("找不到麥克風裝置。接上麥克風或換台裝置再試一次。");
    }else{
      showError("麥克風啟動失敗了。重新整理頁面再試一次看看。");
    }
  });
}

function stopRecording(){
  cancelAnimationFrame(rafId);
  var dur = (performance.now() - recStart)/1000;
  cleanupAudio();
  var avg = 0;
  if(rmsSamples.length){
    for(var i=0;i<rmsSamples.length;i++) avg += rmsSamples[i];
    avg /= rmsSamples.length;
  }
  /* 人聲判斷：樣本夠多、中位音高偏低、低音高佔比高，三者皆成立才拆穿 */
  var human = false;
  if(pitchSamples.length >= MIN_PITCH_FRAMES){
    var sorted = pitchSamples.slice().sort(function(a,b){return a-b;});
    var med = sorted[Math.floor(sorted.length/2)];
    var low = 0;
    for(var j=0;j<pitchSamples.length;j++){ if(pitchSamples[j] < 245) low++; }
    human = (med < HUMAN_PITCH) && (low/pitchSamples.length >= HUMAN_LOW_FRAC);
  }
  goThinking(dur, avg, human);
}

function cleanupAudio(){
  if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
  if(audioCtx){ audioCtx.close().catch(function(){}); audioCtx = null; }
  volRing.style.transform = "";
}

/* ───────── 思考 → 結果 ───────── */
function goThinking(dur, avg, human){
  setState("thinking");
  recBtn.disabled = true;
  recBtn.textContent = "翻譯中…";
  helper.textContent = "解碼貓語中…";
  resetPupils();

  var faces = ["…","喵？","…?","咪…"];
  thinkCycle = 0;
  thinkBubble.textContent = faces[0];
  clearInterval(thinkTimer);
  thinkTimer = setInterval(function(){
    thinkCycle = (thinkCycle+1) % faces.length;
    thinkBubble.textContent = faces[thinkCycle];
  }, 480);

  setTimeout(function(){
    clearInterval(thinkTimer);
    showResult(dur, avg, human);
  }, reduceMotion ? 400 : THINK_MS + Math.random()*300);
}

function pickPhrase(dur, avg, human){
  if(avg < SILENT_RMS) return SILENT_PHRASE;
  if(human){
    var b;
    do { b = BUST_PHRASES[Math.floor(Math.random()*BUST_PHRASES.length)]; }
    while(b.t === lastPhrase && BUST_PHRASES.length > 1);
    lastPhrase = b.t;
    return b;
  }
  var key = (dur < SHORT_SEC)
    ? (avg >= LOUD_RMS ? "urgent" : "cuddle")
    : (avg >= LOUD_RMS ? "protest" : "murmur");
  var pool = PHRASES[key];
  var p;
  do { p = pool[Math.floor(Math.random()*pool.length)]; }
  while(p.t === lastPhrase && pool.length > 1);
  lastPhrase = p.t;
  return p;
}

function showResult(dur, avg, human){
  var p = pickPhrase(dur, avg, human);
  setState("result");
  body.classList.toggle("busted", !!human && avg >= SILENT_RMS);
  recBtn.disabled = false;
  recBtn.textContent = "再錄一次";
  helper.textContent = (human && avg >= SILENT_RMS) ? "被拆穿了？學像一點再來" : "翻譯完成！不服氣就再錄一次";

  bubble.classList.remove("show");
  void bubble.offsetWidth; /* 重新觸發動畫 */
  bubble.classList.add("show");
  /* 先用隱形全文鎖定泡泡尺寸，標籤先佔位再顯示，打字過程不跳動 */
  tagEl.textContent = p.g;
  tagEl.style.visibility = "hidden";
  typewrite(p.t, function(){ tagEl.style.visibility = "visible"; });
}

function typewrite(text, done){
  clearInterval(typeTimer);
  btSizer.textContent = text;
  if(reduceMotion){ btType.textContent = text; done(); return; }
  btType.textContent = "";
  var i = 0;
  typeTimer = setInterval(function(){
    btType.textContent = text.slice(0, ++i);
    if(i >= text.length){ clearInterval(typeTimer); done(); }
  }, 38);
}

function hideBubble(){
  bubble.classList.remove("show");
  body.classList.remove("busted");
  btSizer.textContent = "";
  btType.textContent = "";
  tagEl.textContent = "";
  tagEl.style.visibility = "";
}

function showError(msg){
  cleanupAudio();
  cancelAnimationFrame(rafId);
  clearInterval(typeTimer);
  clearInterval(thinkTimer);
  setState("error");
  body.classList.remove("busted");
  recBtn.disabled = false;
  recBtn.textContent = "再試一次";
  helper.textContent = "";
  bubble.classList.remove("show");
  void bubble.offsetWidth;
  bubble.classList.add("show");
  btSizer.textContent = msg;
  btType.textContent = msg;
  tagEl.style.visibility = "";
  tagEl.textContent = "無奈指數 ★★★★★";
}

/* ───────── 按鈕 ───────── */
recBtn.addEventListener("click", function(){
  if(state === "recording"){ stopRecording(); return; }
  if(state === "thinking") return;
  startRecording();
});

  "本喵已檢查過這個網站，確認沒有藏小魚乾",
  "貓毛不是髒污，是本喵發放的免費紀念品",
  "凌晨三點跑酷大賽，冠軍永遠是你家的貓",
  "警告：長時間注視貓肚肚，可能導致伸手被咬",
  "據觀察，貓推倒杯子之前，都會先看你一眼"
];
var mTrack = document.getElementById("mTrack");
if(mTrack && !reduceMotion){
  var PAW = '<svg class="m-paw" viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="33" rx="10" ry="8"/><circle cx="9" cy="21" r="4.5"/><circle cx="18.5" cy="13.5" r="4.5"/><circle cx="29.5" cy="13.5" r="4.5"/><circle cx="39" cy="21" r="4.5"/></svg>';
  var half = FOOT_MSGS.join(PAW) + PAW;
  mTrack.innerHTML = '<span class="m-half">' + half + '</span><span class="m-half">' + half + '</span>';

/* ───────── 瀏覽器支援檢查 ───────── */
if(!supported()){
  recBtn.disabled = true;
  recBtn.textContent = "無法錄音";
  helper.textContent = "這個瀏覽器不支援錄音，請改用 Chrome 或 Safari 開啟。";
  setState("error");
}
})();
</script>
